      .hole { fill: #181916; }
    }
  </style>
  <circle class="disc" cx="32" cy="32" r="26"/>
  <circle class="groove" cx="32" cy="32" r="23"/>
  <circle class="groove" cx="32" cy="32" r="19.5"/>
  <circle class="label" cx="32" cy="32" r="11"/>
  <circle class="hole" cx="32" cy="32" r="4"/>
</svg>
