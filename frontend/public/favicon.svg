<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tagger">
  <style>
    .disc { fill: #191a17; }
    .groove { fill: none; stroke: #4d4e48; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
    .label { fill: #db3a23; }
    .hole { fill: #fffefa; }
    @media (prefers-color-scheme: dark) {
