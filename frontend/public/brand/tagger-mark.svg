<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Tagger</title>
  <desc id="desc">A solid vinyl record with two grooves, a white spindle hole and a red Polydor-style center label.</desc>
  <style>
    .ink { fill: #191a17; }
    .groove { fill: none; stroke: #4d4e48; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
    .accent { fill: #db3a23; }
    .paper { fill: #fffefa; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f0eee5; }
      .groove { stroke: #c9c6bc; }
      .paper { fill: #181916; }
    }
  </style>
  <circle class="ink" cx="32" cy="32" r="26"/>
  <circle class="groove" cx="32" cy="32" r="23"/>
  <circle class="groove" cx="32" cy="32" r="19.5"/>
  <circle class="accent" cx="32" cy="32" r="11"/>
  <circle class="paper" cx="32" cy="32" r="4"/>
</svg>
