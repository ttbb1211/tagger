name: Build Windows x86_64

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  # 推送 v* tag 时先建 Release（用 GITHUB_TOKEN）。注意：GITHUB_TOKEN 创建的
  # release 不会再触发本 workflow 的 release/published 事件，所以资产由本文件
  # 末尾的 publish_release 直接上传，不存在循环触发。
  create_release:
    name: Create GitHub Release from tag
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # 删除 tag 会连带删除 GitHub 上的 Release（存在删除延迟），
          # 所以这里一律「不存在就创建、存在则先删后建」，保证幂等。
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GH_REPO" --yes || true
          fi
          if [ -f .github/release-notes.md ]; then
            notes_args=(--notes-file .github/release-notes.md)
          else
            notes_args=(--generate-notes)
          fi
          gh release create "$TAG" --repo "$GH_REPO" \
            --target "${GITHUB_SHA}" \
            --title "Tagger ${TAG#v}" \
            "${notes_args[@]}"

  build_windows_amd64:
    name: Build windows/amd64
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      zip_name: ${{ steps.metadata.outputs.zip_name }}
      installer_name: ${{ steps.metadata.outputs.installer_name }}
      checksum_name: ${{ steps.metadata.outputs.checksum_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve build metadata
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            version="${RELEASE_TAG#v}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA:0:7}"
          fi

          if [[ -z "$version" ]]; then
            echo "::error::Could not determine the build version"
            exit 1
          fi

          artifact_name="tagger-windows-amd64-${GITHUB_SHA}"

          {
            echo "version=$version"
            echo "zip_name=tagger_${version}_windows_amd64.zip"
            echo "installer_name=tagger_setup_${version}_windows_amd64.exe"
            echo "checksum_name=tagger_${version}_windows_amd64.zip.sha256"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Build embedded frontend
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          rm -rf web/dist
          mkdir -p web/dist
          cp -R frontend/dist/. web/dist/

      - name: Build Windows binary
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go mod tidy
          mkdir -p dist
          go build -trimpath \
            -ldflags "-X github.com/ericwyn/tagger/internal/version.Version=$VERSION" \
            -o dist/tagger.exe ./cmd/tagger

      - name: Verify Windows executable
        shell: bash
        run: |
          test -f dist/tagger.exe
          file dist/tagger.exe
          file dist/tagger.exe | grep -q 'PE32+.*x86-64'

      - name: Package portable zip and checksum
        shell: bash
        env:
          ZIP_NAME: ${{ steps.metadata.outputs.zip_name }}
          CHECKSUM_NAME: ${{ steps.metadata.outputs.checksum_name }}
        run: |
          mkdir -p release
          cp packaging/windows/使用说明.txt dist/
          powershell -NoProfile -Command "Compress-Archive -Path 'dist/tagger.exe','dist/使用说明.txt' -DestinationPath 'release/${ZIP_NAME}' -Force"
          cd release
          sha256sum "$ZIP_NAME" > "$CHECKSUM_NAME"

      - name: Build installer with Inno Setup
        shell: pwsh
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          function Fail([string]$msg) {
            Write-Host "::error::$msg"
            exit 1
          }
          try {
            Write-Host "::notice::downloading Inno Setup"
            $installer = "$env:RUNNER_TEMP\innosetup-6.7.3.exe"
            Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
            Write-Host "::notice::downloaded $((Get-Item $installer).Length) bytes"
          } catch {
            Fail "download failed: $($_.Exception.Message)"
          }
          try {
            Start-Process -FilePath $installer -Args '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
            Write-Host "::notice::install done"
          } catch {
            Fail "install failed: $($_.Exception.Message)"
          }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { Fail "ISCC.exe not found at $iscc" }
          Write-Host "::notice::running ISCC"
          $out = & $iscc "/DAPP_VERSION=$env:VERSION" packaging/windows/tagger.iss 2>&1
          $out | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            $tail = ($out | Select-Object -Last 8) -join ' | '
            Write-Host "::error::ISCC failed: $tail"
            exit 1
          }
          Write-Host "::notice::ISCC ok"

      - name: Verify installer output
        shell: bash
        env:
          INSTALLER_NAME: ${{ steps.metadata.outputs.installer_name }}
        run: |
          test -f "release/${INSTALLER_NAME}"
          ls -la release/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            release/${{ steps.metadata.outputs.zip_name }}
            release/${{ steps.metadata.outputs.installer_name }}
            release/${{ steps.metadata.outputs.checksum_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish_release:
    name: Attach assets to GitHub Release
    if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - build_windows_amd64
      - create_release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build_windows_amd64.outputs.artifact_name }}
          path: release

      - name: Verify downloaded checksum
        working-directory: release
        env:
          CHECKSUM_NAME: ${{ needs.build_windows_amd64.outputs.checksum_name }}
        run: sha256sum --check "$CHECKSUM_NAME"

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          ZIP_NAME: ${{ needs.build_windows_amd64.outputs.zip_name }}
          INSTALLER_NAME: ${{ needs.build_windows_amd64.outputs.installer_name }}
          CHECKSUM_NAME: ${{ needs.build_windows_amd64.outputs.checksum_name }}
        run: |
          # ★ 不写 #label：让 UI 显示名 = 文件名（已含 ${version}），与 Linux 包一致
          gh release upload "$RELEASE_TAG" \
            "release/$ZIP_NAME" \
            "release/$INSTALLER_NAME" \
            "release/$CHECKSUM_NAME" \
            --clobber \
            --repo "$GH_REPO"
