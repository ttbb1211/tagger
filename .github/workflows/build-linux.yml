name: Build Linux (amd64 & arm64)

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build_linux:
    name: Build linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve build metadata
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MATRIX_GOARCH: ${{ matrix.goarch }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            version="${RELEASE_TAG#v}"
          else
            version="dev-${GITHUB_SHA:0:7}"
          fi

          if [[ -z "$version" ]]; then
            echo "::error::Could not determine the build version"
            exit 1
          fi

          asset_version="${version//\//-}"
          archive_name="tagger_${asset_version}_linux_${MATRIX_GOARCH}.tar.gz"
          checksum_name="${archive_name}.sha256"
          artifact_name="tagger-linux-${MATRIX_GOARCH}-${GITHUB_SHA}"

          {
            echo "version=$version"
            echo "archive_name=$archive_name"
            echo "checksum_name=$checksum_name"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Build embedded frontend and Linux binary
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: make build VERSION="$VERSION" BINARY=tagger

      - name: Verify tests and static checks
        run: |
          make test
          make lint

      - name: Verify Linux executable architecture
        shell: bash
        run: |
          test -x dist/tagger
          file dist/tagger
          if [[ "${{ matrix.goarch }}" == "amd64" ]]; then
            file dist/tagger | grep -q 'ELF 64-bit.*x86-64'
          else
            file dist/tagger | grep -q 'ELF 64-bit.*aarch64'
          fi

      - name: Package binary and checksum
        shell: bash
        env:
          ARCHIVE_NAME: ${{ steps.metadata.outputs.archive_name }}
          CHECKSUM_NAME: ${{ steps.metadata.outputs.checksum_name }}
        run: |
          mkdir -p release
          tar -C dist -czf "release/$ARCHIVE_NAME" tagger
          cd release
          sha256sum "$ARCHIVE_NAME" > "$CHECKSUM_NAME"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            release/${{ steps.metadata.outputs.archive_name }}
            release/${{ steps.metadata.outputs.checksum_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish_release:
    name: Attach assets to GitHub Release
    if: ${{ github.event_name == 'release' }}
    needs:
      - build_linux
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: tagger-linux-*-${{ github.sha }}
          merge-multiple: true
          path: release

      - name: Verify downloaded checksums
        working-directory: release
        shell: bash
        run: |
          ls -la
          sha256sum --check *.sha256

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release/*.tar.gz \
            release/*.sha256 \
            --clobber \
            --repo "$GH_REPO"
